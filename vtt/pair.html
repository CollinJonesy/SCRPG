<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCRPG — GM and Player Display</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d12; color: #f5f2e8; font-family: Inter, sans-serif; }
  .bar {
    height: 36px; display: flex; align-items: center; gap: 14px;
    padding: 0 12px; background: #14171f; font-size: 13px;
  }
  .bar a { color: #9ec0ff; }
  .frames { display: flex; height: calc(100% - 36px); }
  iframe { flex: 1; border: 0; min-width: 0; height: 100%; background: #0b0d12; }
  iframe + iframe { border-left: 3px solid #000; }
</style>
</head>
<body>
<div class="bar">
  <strong>Side by side</strong>
  <span>Left: GM console</span>
  <span>Right: Player Display</span>
  <a href="/index.html?gm=1">GM only</a>
  <a href="/display.html?tv=1">TV only</a>
  <a href="/scene-builder.html">Scene Builder</a>
</div>
<div class="frames">
  <iframe src="/index.html?gm=1" title="GM console"></iframe>
  <iframe src="/display.html?tv=1" title="Player Display"></iframe>
</div>
</body>
</html>
