<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Sheet — SCRPG</title>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<style>
  :root {
    --bg: #12121c; --panel: #1b1b2a; --panel-2: #222236; --line: #34344e;
    --text: #e8e8f2; --text-lo: #9a9ab2; --accent: #4f8cff; --gold: #ffd76a;
    --green: #35c26e; --yellow: #e8c53a; --red: #e05555;
    --hero: #2454E8; --villain: #6e0b0b; --minion: #9a8c00; --lieutenant: #b45309;
    --font-display: 'Bangers', cursive; --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 15px; }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 400; letter-spacing: .5px; margin: 0; }
  button { font-family: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 14px 14px 60px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  .card h2 { font-size: 22px; color: var(--accent); margin-bottom: 8px; }
  .muted { color: var(--text-lo); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  /* Tablet layout (only layout): 16:9 viewport fit — header on top, 3 columns
     filling the rest, each column scrolling independently */
  body.tablet { overflow: hidden; height: 100vh; }
  body.tablet .wrap { height: 100vh; max-width: none; display: flex; flex-direction: column; padding: 10px 12px 12px; }
  body.tablet .wrap > .header-wrap { flex: 0 0 auto; margin-bottom: 12px; }
  body.tablet .sheet-grid { flex: 1 1 auto; min-height: 0; align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  body.tablet .sheet-col { overflow-y: auto; height: 100%; min-height: 0; padding-right: 2px; }

  /* 3-column layout under the header — tracks are minmax(0,1fr) so no card's
     min-content can ever push a column into its neighbor (fully separated) */
  .sheet-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  .sheet-col { min-width: 0; overflow: hidden; }
  .pq-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
  .pq-pair .card { margin-bottom: 14px; min-width: 0; overflow: hidden; }
  .collapsible-head { cursor: pointer; user-select: none; display: flex; justify-content: space-between; align-items: center; }
  .collapsible-head .chev { color: var(--text-lo); font-size: 14px; font-family: var(--font-body); }
  @media (max-width: 940px) { .sheet-grid { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 560px) { .pq-pair { grid-template-columns: minmax(0, 1fr); } }

  /* header row: 4 Location-scale hero tokens OUTSIDE the header, horizontally,
     pushing the header right. Tokens keep Location card size; header keeps
     its own height. */
  .header-wrap { display: flex; gap: 12px; align-items: flex-start; }
  .header-wrap > .card { flex: 1; min-width: 0; margin-bottom: 0; }
  .header-heroes { display: flex; gap: 10px; flex: 0 0 auto; }
  /* Fixed header height shared by the token cards and the header card — only
     the header card's WIDTH ever changes. */
  .header-wrap { --header-h: 170px; }
  .header-heroes .occ-card { flex: 0 0 138px; width: 138px; min-width: 138px; max-width: 138px;
                             height: var(--header-h); overflow: hidden; padding: 0 0 2px; }
  .header-heroes .occ-card .o-art { width: 100%; aspect-ratio: 1/1;
                                    background-size: contain; background-position: center;
                                    border-radius: 6px 6px 0 0; }
  .header-heroes .occ-card .o-name { margin-top: 2px; }
  .header-heroes .occ-card .o-hp { margin-top: 0; padding-bottom: 0; }
  .header-wrap > .card { height: var(--header-h); overflow: hidden; }
  /* identity header */
  .id-head { display: flex; gap: 14px; align-items: stretch; }
  .id-center { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .portrait { width: calc(var(--header-h, 170px) - 32px); height: calc(var(--header-h, 170px) - 32px);
              border-radius: 12px; border: 3px solid var(--hero);
              background: var(--panel-2) center/cover no-repeat; flex: 0 0 auto; }
  /* Name/Alias/Player stay on one row beside the image even when the header
     narrows — the type scales, the position does not. */
  .id-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: nowrap; min-width: 0; }
  .id-name { font-size: clamp(16px, 2.6vw, 30px); line-height: 1.05; }
  .id-alias { font-size: clamp(12px, 1.3vw, 16px); color: var(--gold); }
  .id-player { font-size: clamp(10px, 1vw, 13px); color: var(--text-lo); white-space: nowrap; }
  .health-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .health-bar { flex: 1; height: 12px; border-radius: 6px; background: #0d0d16; overflow: hidden; border: 1px solid var(--line); }
  .health-fill { height: 100%; transition: width .3s; }
  .health-fill.green { background: var(--green); } .health-fill.yellow { background: var(--yellow); }
  .health-fill.red { background: var(--red); } .health-fill.out { background: #555; }
  .health-nums { font-size: 12.5px; color: var(--text-lo); white-space: nowrap; }

  /* scene tracker + status dice */
  .track-status { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .tracker { display: flex; gap: 3px; align-items: center; }
  .tracker .star { width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--line); background: #0d0d16; opacity: .45; }
  .tracker .star.green { background: var(--green); } .tracker .star.yellow { background: var(--yellow); }
  .tracker .star.red { background: var(--red); }
  .tracker .star.here { opacity: 1; outline: 2px solid #fff; outline-offset: 1px; }
  .track-label { font-size: 10px; color: var(--text-lo); text-transform: uppercase; letter-spacing: 1px; margin-right: 4px; }
  .status-row { display: flex; gap: 3px; }
  .status-cell { width: 50px; text-align: center; background: var(--panel-2);
                 border: 1px solid var(--line); border-radius: 8px; padding: 4px 2px; position: relative; }
  .status-cell .die { font-family: var(--font-display); font-size: 16px; }
  .status-cell .die.g { color: var(--green); } .status-cell .die.y { color: var(--yellow); }
  .status-cell .die.r { color: var(--red); } .status-cell .die.o { color: #777; }
  .status-cell.masked::after { content: ''; position: absolute; inset: 0; border-radius: 8px;
                               background: rgba(0,0,0,.3); }
  .status-cell.current { border-width: 2px; border-color: var(--gold); }

  /* dice grids */
  .pq-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .pq { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
        display: flex; justify-content: space-between; align-items: center; gap: 8px; min-width: 0; }
  .pq > span:first-child { min-width: 0; overflow-wrap: anywhere; font-size: clamp(11px, 1.1vw, 14px); }
  .pq .die { font-family: var(--font-display); font-size: clamp(15px, 1.5vw, 20px); color: var(--gold); flex: 0 0 auto; }

  /* abilities */
  .abil-filter { margin-bottom: 8px; }
  .abil { border-left: 4px solid var(--line); background: var(--panel-2); border-radius: 6px;
          padding: 8px 10px; margin-bottom: 8px; }
  .abil.z-Green { border-left-color: var(--green); } .abil.z-Yellow { border-left-color: var(--yellow); }
  .abil.z-Red { border-left-color: var(--red); } .abil.z-Out { border-left-color: #777; }
  .abil .a-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .abil .a-name { font-weight: 600; }
  .abil .a-zone { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-lo); }
  .abil .a-text { margin-top: 4px; font-size: 13.5px; color: #cfcfde; white-space: pre-wrap; }
  .abil .a-meta { margin-top: 4px; font-size: 12px; color: var(--text-lo); }
  .abil.clickable { cursor: pointer; }
  .abil.clickable:hover { background: #2a2a42; }
  .abil.noclick { opacity: .45; cursor: not-allowed; }

  /* principles */
  .principle { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
  .principle .p-name { font-weight: 600; color: var(--gold); }
  .principle .p-line { font-size: 13px; margin-top: 4px; }
  .principle .p-line b { color: var(--text-lo); font-weight: 600; }

  /* location viewer */
  .loc-name { font-size: 24px; color: #4169E1; text-align: center; }
  .occ { display: flex; gap: 10px; flex-wrap: wrap; }
  .occ-card { flex: 1; min-width: 130px; max-width: 170px; background: var(--panel-2);
              border: 2px solid var(--line); border-radius: 10px; padding: 8px; text-align: center; }
  .occ-card.hero { border-color: var(--hero); } .occ-card.villain { border-color: var(--villain); }
  .occ-card.minion { border-color: var(--minion); } .occ-card.lieutenant { border-color: var(--lieutenant); }
  .occ-card.npc { border-color: #7a7a8a; }
  .occ-card .o-art { width: 100%; aspect-ratio: 1/1; border-radius: 8px; background: #0d0d16 center/cover no-repeat; }
  .occ-card .o-name { margin-top: 6px; font-weight: 600; font-size: 13px; }
  .occ-card .o-die { color: var(--gold); font-family: var(--font-display); }
  .occ-card .o-hp { font-size: 11px; color: var(--text-lo); }

  /* notes */
  textarea { width: 100%; min-height: 160px; background: #0d0d16; color: var(--text);
             border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-family: inherit; font-size: 14px; resize: vertical; }
  .btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2);
         color: var(--text); cursor: pointer; font-size: 14px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  /* alerts */
  .alert-banner { border: 2px solid var(--gold); background: #2a2410; color: var(--gold);
                  border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
  .alert-banner .a-ts { font-size: 11px; color: var(--text-lo); margin-top: 6px; }
  .alert-banner .btn { margin-top: 8px; }
  .alert-hist { border-left: 3px solid var(--line); padding: 6px 10px; margin-bottom: 6px; font-size: 13.5px; }
  .alert-hist .a-ts { font-size: 11px; color: var(--text-lo); }

  /* misc */
  .hint-reminders { font-size: 12.5px; color: var(--text-lo); margin-top: 8px; line-height: 1.5; }
  #gate { text-align: center; padding-top: 18vh; }
  #gate h1 { font-size: 42px; color: var(--accent); }
  .hp-dots { font-size: 24px; letter-spacing: 4px; }
  .save-status { font-size: 12px; color: var(--text-lo); margin-left: 8px; }
  @media (max-width: 560px) { .id-head { flex-direction: column; } .portrait { width: 84px; height: 84px; } }

  /* actions */
  .abil .a-actions { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .btn.small { padding: 4px 10px; font-size: 12.5px; }
  .btn.locked { opacity: .55; cursor: not-allowed; }
  .action-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .pending-mod { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
                 padding: 8px 10px; margin-bottom: 6px; font-size: 13.5px; }
  .pending-mod .pm-meta { color: var(--text-lo); font-size: 12px; margin-top: 3px; }

  /* Reminder boxes (generic: data-rem + data-rem-kind on any element) */
  .reminder-box { position: fixed; z-index: 60; background: #26263c; border: 1px solid var(--gold);
                  border-radius: 8px; padding: 8px 10px; font-size: 13px; color: var(--text);
                  box-shadow: 0 4px 14px rgba(0,0,0,.5); pointer-events: none; line-height: 1.45; }
  .reminder-box b { color: var(--gold); }

  /* Are You Sure? modal */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 50;
                    display: flex; align-items: center; justify-content: center; padding: 16px; }
  .ays { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
         max-width: 640px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 18px; }
  .ays h2 { color: var(--gold); font-size: 24px; margin-bottom: 10px; }
  .ays .bd-row { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
                 padding: 8px 10px; margin-bottom: 8px; font-size: 13.5px; }
  .ays .bd-row b { color: var(--text); }
  .ays label { display: block; margin: 8px 0 2px; font-size: 13px; color: var(--text-lo); }
  .ays input[type=number], .ays select { width: 100%; background: #0d0d16; color: var(--text);
        border: 1px solid var(--line); border-radius: 6px; padding: 7px; font-size: 14px; }
  .ays .dice-row { display: flex; gap: 8px; }
  .ays .dice-row > div { flex: 1; }
  .ays .roll-mode-stack { flex: 0 0 auto; display: flex; flex-direction: column; gap: 4px; justify-content: center; }
  .ays .roll-mode-stack .radio-line { margin: 0; white-space: nowrap; font-size: 13px; }
  .ays .pq-selects { margin-top: 8px; align-items: flex-end; }
  .ays .pq-selects > div { min-width: 0; }
  .ays .blk { border-left: 3px solid var(--accent); padding-left: 10px; margin: 12px 0; }
  .ays .outcome { background: #14251a; border: 1px solid var(--green); border-radius: 8px;
                  padding: 10px 12px; margin-top: 10px; font-size: 14px; }
  .ays .outcome.err { background: #2a1414; border-color: var(--red); }
  .ays .radio-line { display: flex; align-items: center; gap: 8px; margin: 4px 0; color: var(--text); font-size: 13.5px; }
  .ays .radio-line input { width: auto; }
  .ays .foot { display: flex; gap: 10px; margin-top: 14px; justify-content: flex-end; }
  .ays .fineprint { color: var(--text-lo); font-size: 12px; margin-top: 8px; line-height: 1.5; }
</style>
</head>
<body>

<div id="gate" class="wrap">
  <h1>Hero Sheet</h1>
  <p class="muted">Opening your sheet…</p>
</div>

<div id="sheet" class="wrap" style="display:none;"></div>

<script>
'use strict';
const params = new URLSearchParams(location.search);
const HERO = params.get('hero') || '';
const KEY = params.get('key') || '';

// Tablet layout is the only layout (16:9 viewport fit).
document.body.classList.add('tablet');

let lastPayload = null;
let notesDirty = false;

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function dieNum(d) { const n = parseInt(String(d || '').replace(/\D/g, ''), 10); return isNaN(n) ? 0 : n; }

// Health band from current/max health: green >50%, yellow 11-50%, red 1-10%, out at 0.
function healthBand(cur, max) {
  const c = Number(cur), m = Number(max);
  if (!isFinite(c) || !isFinite(m) || m <= 0) return 'green';
  if (c <= 0) return 'out';
  const pct = c / m * 100;
  if (pct > 50) return 'green';
  if (pct >= 11) return 'yellow';
  if (pct >= 1) return 'red';
  return 'out';
}

const BAND_ORDER = { green: 0, yellow: 1, red: 2, out: 3 };
function worseBand(a, b) { return (BAND_ORDER[a] ?? 0) >= (BAND_ORDER[b] ?? 0) ? a : b; }
function bandLetter(b) { return b === 'green' ? 'g' : b === 'yellow' ? 'y' : b === 'red' ? 'r' : 'o'; }

function portraitUrl(kind, slug) {
  const pk = kind === 'hero' ? 'hero' : kind === 'villain' ? 'villain' : 'minion';
  return '/api/backgrounds/portrait-' + pk + '-' + encodeURIComponent(slug);
}

// Effective group for sorting occupants. 0 villains, 1 lieutenants, 2 minions,
// 3 bystanders, 4 players (self is excluded before this runs).
function occGroup(t) {
  const k = t.kind || '';
  if (k === 'villain') return 0;
  if (k === 'lieutenant' || (k === 'npc' && t.npcType === 'Lieutenant')) return 1;
  if (k === 'minion' || (k === 'npc' && t.npcType === 'Minion')) return 2;
  if (k === 'npc' && t.npcType === 'Bystander') return 3;
  return 4;
}
const OCC_GROUP_CLASS = { 0: 'villain', 1: 'lieutenant', 2: 'minion', 3: 'npc', 4: 'hero' };

function sortedOccupants(list) {
  return (list || [])
    .filter(t => t.slug !== HERO)
    .map(t => ({ t, g: occGroup(t), name: String(t.name || '') }))
    .sort((a, b) => a.g - b.g || a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
}

function fetchSheet() {
  return fetch(`/api/player-sheet?hero=${encodeURIComponent(HERO)}&key=${encodeURIComponent(KEY)}`)
    .then(r => r.json().then(j => ({ status: r.status, body: j })));
}

// ---- sorting helpers (highest die first, alphabetical on ties) ----
function pqSorted(row, prefix, count) {
  const out = [];
  for (let i = 1; i <= count; i++) {
    const name = row[prefix + i] || '';
    if (!name) continue;
    out.push({ real: String(name), name: String(row[prefix + i + 'DisplayName'] || name), die: row[prefix + 'Die' + i] || '' });
  }
  out.sort((a, b) => dieNum(b.die) - dieNum(a.die) || a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
  return out;
}

const ZONE_ORDER = { Green: 0, Yellow: 1, Red: 2, Out: 3 };
function isPrincipleAbility(a) { return /^principle\b/i.test(String(a.Name || '')); }
function abilitiesSorted(list) {
  return (list || []).slice().sort((a, b) => {
    const za = ZONE_ORDER[a.Zone || 'Green'] ?? 9, zb = ZONE_ORDER[b.Zone || 'Green'] ?? 9;
    if (za !== zb) return za - zb;
    if (za === 0) { // principles sink to the bottom of Green
      const pa = isPrincipleAbility(a) ? 1 : 0, pb = isPrincipleAbility(b) ? 1 : 0;
      if (pa !== pb) return pa - pb;
    }
    const na = String(a.DisplayName || a.Name || ''), nb = String(b.DisplayName || b.Name || '');
    return na.localeCompare(nb, undefined, { sensitivity: 'base' });
  });
}

function modesOf(list) {
  const modes = new Set();
  (list || []).forEach(a => { const m = String(a.Mode || '').trim(); if (m) modes.add(m); });
  return [...modes].sort();
}

// ---- section renderers ----
function pqGridHtml(row, prefix, count) {
  const items = pqSorted(row, prefix, count);
  const remKind = prefix === 'Power' ? 'powers' : 'qualities';
  return items.map(it => `<div class="pq" data-rem="${esc(it.real)}" data-rem-kind="${remKind}"><span>${esc(it.name)}</span><span class="die">${esc(it.die)}</span></div>`).join('')
    || '<span class="muted">None recorded.</span>';
}

// ================= Reminder Box architecture =================
// One delegated hover handler for the WHOLE sheet: any element carrying
// data-rem (real name) + data-rem-kind (powers|qualities) gets a floating
// box after 1 second of hover, showing the real name + catalog description.
// To attach a reminder elsewhere later: add those two data attributes.
let REMINDERS = { powers: {}, qualities: {} };
let remTimer = null;

function loadReminders() {
  return fetch('/api/reminders').then(r => r.json())
    .then(j => { REMINDERS = j && j.powers ? j : { powers: {}, qualities: {} }; })
    .catch(() => {});
}

function showReminderBox(el, kind, name) {
  hideReminderBox();
  const desc = (REMINDERS[kind] || {})[name] || '';
  const box = document.createElement('div');
  box.className = 'reminder-box';
  box.id = 'remBox';
  box.innerHTML = desc
    ? `<b>${esc(name)}:</b> ${esc(desc)}`
    : `<b>${esc(name)}</b><div class="fineprint">No description on record.</div>`;
  document.body.appendChild(box);
  const r = el.getBoundingClientRect();
  const bw = Math.min(320, window.innerWidth - 16);
  let left = Math.max(8, Math.min(r.left, window.innerWidth - bw - 8));
  let top = r.bottom + 6;
  if (top + box.offsetHeight > window.innerHeight - 8) top = Math.max(8, r.top - box.offsetHeight - 6);
  box.style.left = left + 'px';
  box.style.top = top + 'px';
  box.style.maxWidth = bw + 'px';
}
function hideReminderBox() {
  clearTimeout(remTimer);
  remTimer = null;
  const box = document.getElementById('remBox');
  if (box) box.remove();
}
document.addEventListener('mouseover', e => {
  const el = e.target && e.target.closest ? e.target.closest('[data-rem]') : null;
  if (!el) return;
  clearTimeout(remTimer);
  remTimer = setTimeout(() => showReminderBox(el, el.dataset.remKind, el.dataset.rem), 1000);
});
document.addEventListener('mouseout', e => {
  const el = e.target && e.target.closest ? e.target.closest('[data-rem]') : null;
  if (el) hideReminderBox();
});

function trackerColor(p) {
  const tr = p.tracker;
  if (!tr || !tr.stars || !tr.stars.length) return 'green';
  const pos = Math.max(0, Math.min(tr.stars.length - 1, Number(tr.position) || 0));
  return tr.stars[pos] || 'green';
}

function trackerHtml(p) {
  const tr = (p.tracker && p.tracker.stars) ? p.tracker : null;
  if (!tr || !tr.stars || !tr.stars.length) return '<span class="muted" style="font-size:12px;">No scene tracker.</span>';
  const pos = Math.max(0, Math.min(tr.stars.length - 1, Number(tr.position) || 0));
  const stars = tr.stars.map((c, i) => `<span class="star ${esc(c)} ${i === pos ? 'here' : ''}"></span>`).join('');
  return `<div class="tracker"><span class="track-label">Scene Tracker</span>${stars}</div>`;
}

function statusRowHtml(p) {
  const row = p.row || {};
  const hp = healthBand(p.myToken && p.myToken.currentHealth, p.myToken && p.myToken.maxHealth);
  const trColor = trackerColor(p);
  // Hero status = the worse of personal health band and the scene tracker color (RAW).
  const cur = (p.myToken && p.myToken.maxHealth) ? worseBand(hp, trColor) : 'green';
  const curL = bandLetter(cur);
  return ['g', 'y', 'r'].map(l => {
    const key = l === 'g' ? 'GreenStatusDie' : l === 'y' ? 'YellowStatusDie' : 'RedStatusDie';
    const dieVal = l === curL ? (p.myToken && p.myToken.currentDie) || row[key] || '—' : (row[key] || '—');
    return `<div class="status-cell ${l === curL ? 'current' : 'masked'}">
      <div class="muted" style="font-size:11px;">${l === 'g' ? 'Green' : l === 'y' ? 'Yellow' : 'Red'}</div>
      <div class="die ${l}">${esc(dieVal)}</div>
    </div>`;
  }).join('');
}

function currentBandLetter(p) {
  const hp = healthBand(p.myToken && p.myToken.currentHealth, p.myToken && p.myToken.maxHealth);
  const cur = (p.myToken && p.myToken.maxHealth) ? worseBand(hp, trackerColor(p)) : 'green';
  return bandLetter(cur);
}

const SWITCH_ABILITIES = ['switch', 'quick switch', 'emergency switch'];

// Mode-aware ability filtering.
//  - 'all': everything.
//  - 'status': cumulative availability (G -> G, Y -> G+Y, R -> all but Out),
//    and ALWAYS excludes mode-specific rows — a hero only has their mode's
//    abilities while IN that mode. Default-mode (Mode blank) rows only.
//  - 'mode:<slug>': strict membership from the hero's ## Modes JSON — that
//    mode's picked powers + principles + the Switch family (+ Out).
//    Powerless modes suppress every ability card.
function abilitiesForFilter(p, filter, all) {
  if (filter === 'all') return all;
  if (filter === 'status') {
    const rank = { Green: 0, Yellow: 1, Red: 2 };
    const curRank = rank[currentBandLetter(p) === 'g' ? 'Green' : currentBandLetter(p) === 'y' ? 'Yellow' : 'Red'] ?? 0;
    return all.filter(a => !(a.Mode || '').trim() && (rank[a.Zone || 'Green'] ?? 3) <= curRank);
  }
  const slug = String(filter).replace(/^mode:/, '');
  const mode = (p.modes || []).find(m => String(m.slug || '') === slug);
  if (!mode) return all.filter(a => !(a.Mode || '').trim());
  if (mode.powerless) return [];
  if (slug === 'default') return all.filter(a => !(a.Mode || '').trim());
  const powerNames = new Set(Object.keys(mode.powers || {}).map(n => String(n).toLowerCase()));
  return all.filter(a => {
    const am = String(a.Mode || '').trim();
    if (am === slug) return true;
    if (am) return false;
    const n = String(a.Name || '').toLowerCase();
    return powerNames.has(n) || /^principle\b/.test(n) || SWITCH_ABILITIES.includes(n) || n === 'out';
  });
}

function modeButtonLabel(m) {
  const name = String(m.name || m.slug || '').replace(/\bmodular\b/ig, '').replace(/\s+/g, ' ').trim();
  return (name || String(m.slug)) + (/mode$/i.test(name) ? '' : ' Mode');
}

function switchToMode(slug) {
  // VIEW-ONLY: clicking a mode filter shows that mode's abilities. Switching
  // the hero's actual mode is only allowed through an ability that grants it
  // (Switch / Quick Switch / Emergency Switch — built in Phase 2 on top of
  // /api/player-mode, which stays server-gated for that flow).
  window.__abilFilter = 'mode:' + slug;
  renderSheet(lastPayload);
}

function bhdRowHtml(p) {
  const bhd = (p.myToken && p.myToken.bhd) || {};
  const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
  const boost = num(bhd.boost), hinder = num(bhd.hinder), defend = num(bhd.defend);
  const cells = [
    ['Boost', boost >= 0 ? '+' + boost : String(boost)],
    ['Hinder', hinder >= 0 ? '−' + hinder : '+' + Math.abs(hinder)],
    ['Defend', defend >= 0 ? '+' + defend : String(defend)],
  ];
  return cells.map(([label, val]) => `
    <div class="status-cell">
      <div class="muted" style="font-size:11px;">${label}</div>
      <div class="die o">${esc(val)}</div>
    </div>`).join('');
}

function typeLetter(a) {
  const t = String(a.Type || '').trim().toUpperCase();
  return ['A', 'I', 'R'].includes(t) ? t : '';
}

function abilitiesHtml(p) {
  const isModular = (p.modes || []).length > 0;
  if (isModular && window.__abilFilter === undefined) window.__abilFilter = 'mode:' + (p.currentMode || 'default');
  const filter = (window.__abilFilter === undefined ? 'all' : window.__abilFilter);
  const all = abilitiesSorted(p.abilities);
  abilitiesByName = {};
  all.forEach(a => { abilitiesByName[String(a.Name || '')] = a; });
  const shown = abilitiesForFilter(p, filter, all);
  const curMode = String(p.currentMode || 'default');
  let filterUi;
  if (isModular) {
    // Modular heroes: All + Status BUTTONS, plus a separate dropdown for the
    // modes ONLY (that's the part that saves room).
    const modeOptions = p.modes.map(m => {
      const slug = String(m.slug || '');
      return `<option value="mode:${esc(slug)}" ${filter === 'mode:' + slug ? 'selected' : ''}>${esc(modeButtonLabel(m))}</option>`;
    }).join('');
    filterUi = `<div class="abil-filter row">
        <button class="btn ${filter === 'all' ? 'primary' : ''}" onclick="setAbilFilter('all')">All</button>
        <button class="btn ${filter === 'status' ? 'primary' : ''}" onclick="setAbilFilter('status')">Status</button>
        <select class="scene-difficulty-select" onchange="setAbilFilter(this.value)">
          <option value="" disabled ${filter.startsWith('mode:') ? '' : 'selected'}>Modes…</option>
          ${modeOptions}
        </select>
      </div>`;
  } else {
    filterUi = `<div class="abil-filter row">
        <button class="btn ${filter === 'all' ? 'primary' : ''}" onclick="setAbilFilter('all')">All</button>
        <button class="btn ${filter === 'status' ? 'primary' : ''}" onclick="setAbilFilter('status')">Status</button>
      </div>`;
  }
  const rows = shown.map(a => {
    const t = typeLetter(a);
    const roll = String(a.RollType || '').trim();
    const title = [t, esc(a.DisplayName || a.Name), esc(roll)].filter(Boolean).join(' - ');
    const meta = [a.DieSource ? 'Source: ' + a.DieSource : ''].filter(Boolean).map(esc).join(' · ');
    const name = String(a.Name || '');
    const actionable = rollTypesOf(a).length || isActionChoiceAbility(a);
    const click = bandAllowsZone(p, a.Zone) && actionable
      ? ` onclick="openAbilityAction('${esc(name)}')" title="Tap to use this ability"`
      : ` title="${bandAllowsZone(p, a.Zone) ? 'No roll types on this ability' : 'Your status band does not allow this ability yet'}"`;
    return `
    <div class="abil z-${esc(a.Zone || 'Green')}${abilityRowClass(p, a)}"${click}>
      <div class="a-head"><span class="a-name">${title}</span></div>
      <div class="a-text">${esc(a.GameText || '')}</div>
      ${meta ? `<div class="a-meta">${meta}</div>` : ''}
    </div>`;
  }).join('');
  return filterUi + basicActionsHtml(p) + (rows || '<span class="muted">No abilities in this view.</span>');
}

function setAbilFilter(f) { window.__abilFilter = f; renderSheet(lastPayload); }

// Location card is collapsible; state survives the 3s poll re-renders.
let locOpen = false;
function toggleLocationCard() {
  locOpen = !locOpen;
  const box = document.getElementById('locBox');
  const chev = document.getElementById('locChev');
  if (box) box.style.display = locOpen ? 'block' : 'none';
  if (chev) chev.textContent = locOpen ? '▾' : '▸';
}

function principlesHtml(row) {
  const out = [];
  for (const n of [1, 2]) {
    const name = row['Principle' + n + 'Name'] || '';
    if (!name) continue;
    out.push(`<div class="principle">
      <div class="p-name">${esc(name)}</div>
      ${row['Principle' + n + 'Roleplay'] ? `<div class="p-line"><b>Roleplay:</b> ${esc(row['Principle' + n + 'Roleplay'])}</div>` : ''}
      ${row['Principle' + n + 'MinorTwist'] ? `<div class="p-line"><b>Minor Twist:</b> ${esc(row['Principle' + n + 'MinorTwist'])}</div>` : ''}
      ${row['Principle' + n + 'MajorTwist'] ? `<div class="p-line"><b>Major Twist:</b> ${esc(row['Principle' + n + 'MajorTwist'])}</div>` : ''}
    </div>`);
  }
  return out.join('') || '<span class="muted">No principles recorded.</span>';
}

function occupantsHtml(p) {
  if (!p.location || !p.location.name) return '<span class="muted">You are not on the board yet. The GM will place you when the scene starts.</span>';
  // Players live in the header now; the Location card shows everyone else.
  const cards = sortedOccupants(p.occupants).filter(x => x.g !== 4).map(({ t, g }) => {
    let hpLine = '';
    if (t.kind !== 'villain' && t.currentHealth != null && t.maxHealth) {
      hpLine = `<div class="o-hp">Health ${t.currentHealth}/${t.maxHealth}</div>`;
    } else if (t.kind === 'villain') {
      hpLine = '<div class="o-hp">Health ???</div>';
    }
    return `<div class="occ-card ${OCC_GROUP_CLASS[g]}">
      <div class="o-art" style="background-image:url('${esc(portraitUrl(t.kind, t.slug))}')"></div>
      <div class="o-name">${esc(t.name)}</div>
      <div class="o-die">${esc(t.currentDie || '')}</div>
      ${hpLine}
    </div>`;
  }).join('');
  return `<div class="loc-name">${esc(p.location.name)}</div><div class="occ">${cards || '<span class="muted">Nobody else here.</span>'}</div>`;
}

function alertsHtml(p) {
  const active = (p.alerts || []).filter(a => !a.dismissed);
  const hist = (p.alerts || []).filter(a => a.dismissed).slice().reverse();
  const banners = active.map(a => `
    <div class="alert-banner">
      <div>📩 ${esc(a.text)}</div>
      <div class="a-ts">From the GM · ${esc(a.ts || '')}</div>
      <button class="btn" onclick="dismissAlert('${esc(a.id)}')">Dismiss</button>
    </div>`).join('');
  const history = hist.length ? `<div style="margin-top:6px;"><h3 style="font-size:16px;color:var(--text-lo);">Alert history</h3>` +
    hist.map(a => `<div class="alert-hist">${esc(a.text)}<div class="a-ts">${esc(a.ts || '')}</div></div>`).join('') + '</div>' : '';
  return banners + history;
}

function hpDots(n) {
  return '<span class="hp-dots">' + '●'.repeat(n) + '<span style="color:#444;">' + '●'.repeat(Math.max(0, 5 - n)) + '</span></span>';
}

function headerHeroesHtml(p) {
  // Location-card build at 1:1 scale: image, name, health.
  const heroes = sortedOccupants(p.occupants).filter(x => x.g === 4).slice(0, 4);
  return heroes.map(({ t }) => {
    let hpLine = '';
    if (t.currentHealth != null && t.maxHealth) hpLine = `<div class="o-hp">Health ${t.currentHealth}/${t.maxHealth}</div>`;
    return `<div class="occ-card hero">
      <div class="o-art" style="background-image:url('${esc(portraitUrl(t.kind, t.slug))}')"></div>
      <div class="o-name">${esc(t.name)}</div>
      ${hpLine}
    </div>`;
  }).join('');
}

function renderSheet(p) {

  const maxHP = p.myToken && p.myToken.maxHealth != null ? p.myToken.maxHealth : (Number(row.MaxHealth) || null);

  document.getElementById('sheet').innerHTML = `
    <div class="header-wrap">
      <div class="header-heroes">${headerHeroesHtml(p)}</div>
      <div class="card">
        <div class="id-head">
          <div class="portrait" id="portraitBox" style="background-image:url('${esc(portraitUrl('hero', HERO))}')"></div>
          <div class="id-center">
            <div class="id-row">
              <h1 class="id-name">${esc(row.Name || '')}</h1>
              <span class="id-alias">${esc(row.Alias || '')}</span>
              <span class="id-player">${esc(row.Player || '')}</span>
            </div>
            <div class="health-row">
              <div class="health-bar"><div class="health-fill ${band}" style="width:${hpPct}%"></div></div>
              <span class="health-nums">Current ${curHP != null ? curHP : '—'} / Max ${maxHP != null ? maxHP : '—'}</span>
            </div>
            <div class="track-status">
              ${trackerHtml(p)}
              <div class="status-row">${statusRowHtml(p)}</div>
              <div class="status-row">${bhdRowHtml(p)}</div>
            </div>

          <div style="flex:0 0 90px;"></div>
        </div>
      </div>
    </div>

    <div class="sheet-grid">
      <div class="sheet-col">
        <div class="pq-pair">
          <div class="card"><h2>Powers</h2><div class="pq-grid">${pqGridHtml(row, 'Power', 6)}</div></div>
          <div class="card"><h2>Qualities</h2><div class="pq-grid">${pqGridHtml(row, 'Quality', 6)}</div></div>
        </div>
        <div class="card"><h2>Principles &amp; Twists</h2>${principlesHtml(row)}</div>
      </div>

      <div class="sheet-col">
        <div id="alertsBox">${alertsHtml(p)}</div>
        <div class="card"><h2>Mods Waiting on You</h2><div id="pendingModsBox">${pendingModsHtml(p)}</div></div>
        <div class="card"><h2>Abilities</h2><div id="abilList">${abilitiesHtml(p)}</div></div>
      </div>

      <div class="sheet-col">
        <div class="card"><h2>Notes</h2>
          <textarea id="notesArea" placeholder="Type Session Notes, Personal Notes, or Reminders Here...">${esc(p.notes || '')}</textarea>
          <div class="row" style="margin-top:8px;">
            <button class="btn primary" id="notesSaveBtn" onclick="saveNotes()">Save Notes</button>
            <span class="save-status" id="notesStatus"></span>
          </div>
        </div>
        <div class="card"><h2>Hero Points — ${esc(hp.issue || 'this Issue')}</h2>
          <div style="display:flex;justify-content:space-between;align-items:center;">
            ${hpDots(hp.mine || 0)}
            <span style="font-size:15px;color:var(--text-lo);">${hp.mine || 0} / 5</span>
          </div>
        </div>
        <div class="card">
          <h2 class="collapsible-head" onclick="toggleLocationCard()">Location <span class="chev" id="locChev">${locOpen ? '▾' : '▸'}</span></h2>
          <div id="locBox" style="display:${locOpen ? 'block' : 'none'};">${occupantsHtml(p)}</div>
        </div>
      </div>

  `;
  const ta = document.getElementById('notesArea');
  if (prevNotes !== null) ta.value = prevNotes;
  ta.addEventListener('input', () => { notesDirty = true; });
  // restore column scroll positions after the re-render
  document.querySelectorAll('.sheet-col').forEach((c, i) => { if (prevScrolls[i]) c.scrollTop = prevScrolls[i]; });
}

async function saveNotes() {
  const ta = document.getElementById('notesArea');
  const st = document.getElementById('notesStatus');
  st.textContent = 'Saving…';
  try {
    const r = await fetch('/api/player-notes', { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ hero: HERO, key: KEY, text: ta.value }) });
    if (!r.ok) throw new Error('bad status');
    notesDirty = false;
    st.textContent = 'Saved ✓';
    setTimeout(() => { const s = document.getElementById('notesStatus'); if (s) s.textContent = ''; }, 4000);
  } catch (e) {
    st.textContent = 'Save failed — try again.';
  }
}

async function dismissAlert(id) {
  await fetch('/api/alerts', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ op: 'dismiss', hero: HERO, key: KEY, id }) });
  const r = await fetchSheet();
  if (r.status === 200) { lastPayload = r.body; renderSheet(r.body); }
}

// ================= Player actions (Phase 2) =================
// Every action stages here first: full breakdown → Manual or Digital roll →
// confirm → POST /api/player-action (server computes the outcome and mutates
// the scene). The 3s poll pauses while ANY decision surface is open.

let aysState = null;      // truthy while the Are-You-Sure modal is open
let aysInFlight = false;  // confirm POST in flight

function lockedActionsFor(p) {
  const slug = String(p.currentMode || 'default');
  const mode = (p.modes || []).find(m => String(m.slug || '') === slug);
  const locked = new Set((((mode || {}).lockedActions) || []).map(a => String(a).toLowerCase()));
  locked.delete('recover'); // Recover is NEVER mode-locked
  return locked;
}

function rollTypesOf(a) {
  return String(a.RollType || '').split(',').map(s => s.trim()).filter(Boolean);
}

const BASIC_ACTIONS = ['Attack', 'Defend', 'Boost', 'Hinder', 'Overcome'];

function basicActionsHtml(p) {
  // No basic Recover action — Recover exists ONLY inside abilities that grant
  // it (their own Recover buttons); Montage recovery is part of the scene, not
  // a taken action, so there is no Recover button at all here.
  const locked = lockedActionsFor(p);
  return `<div class="action-bar">` + BASIC_ACTIONS.map(t => {
    if (locked.has(t.toLowerCase())) {
      return `<button class="btn small locked" disabled title="${esc(t)} is locked in this mode">${esc(t)} 🔒</button>`;
    }
    return `<button class="btn small primary" onclick="openBasicAction('${esc(t)}')">${esc(t)}</button>`;
  }).join('') + `</div>`;
}

function openBasicAction(t) { openActionStaged([t], null); }

function targetOptionsFor(p, type) {
  // Same-location rule is enforced server-side too; the sheet only offers
  // tokens in the hero's location. Overcome types get a free-text target.
  return (p.occupants || []).map(t =>
    `<option value="${esc(t.id)}">${esc(t.name)} (${esc(t.kind)})</option>`).join('');
}

function modSpendHtml(p, idx, ignorePenalties) {
  const mods = (p.pendingMods || []).filter(m =>
    !(ignorePenalties && m.kind === 'hinder'));
  if (!mods.length) return '';
  return `<div class="bd-row"><b>Spend mods on this roll</b> (you decide when a Boost/Hinder happens)` +
    mods.map(m => `<div class="radio-line"><input type="checkbox" class="ays-mod" data-block="${idx}" id="mod_${idx}_${esc(m.id)}">
      <label for="mod_${idx}_${esc(m.id)}" style="margin:0;display:inline;color:var(--text);">` +
      `${m.kind === 'boost' ? '+' : '−'}${m.value} ${esc(m.kind)} from ${esc(m.creator)}` +
      `${m.uses > 1 ? ` — ${m.uses} uses (minor twist: “${esc(m.twist)}”)` : ''}</label></div>`).join('') + `</div>`;
}

function openActionStaged(types, ability) {
  const p = lastPayload;
  if (!p) return;
  if (ability && /emergency switch/i.test(String(ability.Name || ''))) {
    return openEmergencySwitchStaged(p, ability);
  }
  aysState = { types: types.slice(), ability };
  aysState.actionChoice = isActionChoiceAbility(ability);
  if (aysState.actionChoice) aysState.types = ['Attack', 'Defend'];
  types = aysState.types;
  const row = p.row || {};
  const heroName = row.Name || HERO;
  const abilName = ability ? (ability.DisplayName || ability.Name) : ('Basic ' + types[0]);
  const modeChange = ability && /switch/i.test(String(ability.Name || ''))
    ? { position: /quick switch/i.test(String(ability.Name || '')) ? 'pre' : 'post' } : null;
  aysState.modeChange = modeChange;
  // Flags parsed from GameText (server enforces the same rules).
  const gt = String((ability || {}).GameText || '');
  const ignorePenalties = /ignore.{0,30}penalt/i.test(gt) || /ignore.{0,30}defend/i.test(gt);
  const noReactions = /cannot be affected by reactions/i.test(gt);
  aysState.flags = { ignorePenalties, noReactions };
  // Dice the ability forces via [Brackets] — locked dropdowns.
  const forced = forcedDiceFromText(gt, row);
  aysState.forced = forced;
  const typeWord = { A: 'Action', R: 'Reaction' }[String((ability || {}).Type || '').trim().toUpperCase()] || 'Action';
  const headerLine = ability
    ? `Action: ${esc(ability.DisplayName || ability.Name)}${types.length ? ' - ' + esc(types.join(', ')) : ''}`
        .replace(/^Action:/, typeWord + ':')
    : `Action: ${esc('Basic ' + types[0])}`;
  const blocks = null; // replaced by shared dice + per-action target rows
  const targetRows = types.map((t, i) => targetRowHtml(p, t, i)).join('');
  const modeSel = modeChange
    ? `<div class="bd-row"><b>${/quick/i.test(ability.Name) ? 'Quick Switch' : 'Switch'}:</b>
        <label>New mode</label><select id="aysMode">${(p.modes || []).map(m =>
          `<option value="${esc(m.slug)}">${esc(m.name || m.slug)}</option>`).join('')}</select>
        ${modeChange.position === 'pre' ? '<div class="fineprint">Order: destroy one bonus on you → change mode → then the action happens in the NEW mode.</div>'
          : '<div class="fineprint">Order: the action happens in your CURRENT mode first, then the mode changes.</div>'}</div>`
    : '';
  showAys(`Are You Sure? — ${esc(heroName)}`, `
    <div class="bd-row"><b>${headerLine}</b>
      ${ability ? `<div class="fineprint">${esc(ability.GameText || '')}</div>` : ''}
      ${ignorePenalties ? '<div class="fineprint">This attack ignores all penalties — Hinders on you cannot apply and Defend actions are ignored.</div>' : ''}
      ${noReactions ? '<div class="fineprint">Reactions cannot affect this ability.</div>' : ''}
    </div>
    ${aysState.actionChoice ? actionChoiceRowHtml() : ''}
    ${diceBlockHtml(p, 0)}
    <div id="aysTargetsBox">${targetRows}</div>
    ${modSpendHtml(p, 0, ignorePenalties)}
    ${modeSel}
    <div class="fineprint">On confirm this applies to the board immediately — the GM sees it land live. Nothing happens until you press Confirm.</div>
    <div id="aysOutcome"></div>
    <div class="foot">
      <button class="btn" onclick="closeAys()">Cancel</button>
      <button class="btn primary" id="aysConfirmBtn" onclick="confirmAys()">Confirm — Apply</button>
    </div>`);
}

// One Target row per basic action, stacked directly below each other, no
// per-action type boxes. Boost/Hinder rows carry their two-use twist inline.
function targetRowHtml(p, t, i) {
  const target = t === 'Overcome'
    ? `<input type="text" id="aysTargetLabel_${i}" placeholder="Door, alarm, scene object…">`
    : `<select id="aysTarget_${i}">${targetOptionsFor(p, t)}</select>`;
  const twist = (t === 'Boost' || t === 'Hinder') ? modTwistHtml(p, i) : '';
  return `<div class="bd-row"><label>${esc(t)} Target</label>${target}</div>${twist}`;
}

// Flexible Stance-style abilities: "Take any two basic actions…" — two
// dropdowns of all six basics, side by side, at the top of the prompt.
function isActionChoiceAbility(a) {
  if (!a || rollTypesOf(a).length) return false;
  return /take (any|one|two)[^.]{0,30}basic action/i.test(String(a.GameText || ''));
}
const ALL_SIX_ACTIONS = ['Attack', 'Defend', 'Boost', 'Hinder', 'Overcome', 'Recover'];
function actionChoiceRowHtml() {
  const opts = (sel, dflt) => ALL_SIX_ACTIONS.map(t =>
    `<option value="${esc(t)}"${t === dflt ? ' selected' : ''}>${esc(t)}</option>`).join('');
  return `<div class="bd-row"><div class="dice-row pq-selects" style="margin-top:0;">
      <div><label>First action</label><select id="aysChoice_0" onchange="rebuildAysTargets()">${opts(0, 'Attack')}</select></div>
      <div><label>Second action</label><select id="aysChoice_1" onchange="rebuildAysTargets()">${opts(1, 'Defend')}</select></div>
    </div>
    <div class="fineprint">The two actions may be the same action twice; each gets its own target and the same roll.</div></div>`;
}
function rebuildAysTargets() {
  const c0 = (document.getElementById('aysChoice_0') || {}).value || 'Attack';
  const c1 = (document.getElementById('aysChoice_1') || {}).value || 'Defend';
  aysState.types = [c0, c1];
  const box = document.getElementById('aysTargetsBox');
  if (box) box.innerHTML = aysState.types.map((t, i) => targetRowHtml(lastPayload, t, i)).join('');
}

// [Bracketed] dice in ability text, matched against the hero's real
// power/quality names — those dropdowns get locked.
function forcedDiceFromText(gt, row) {
  const out = { power: '', quality: '' };
  const brackets = (String(gt || '').match(/\[([^\]]+)\]/g) || []).map(s => s.slice(1, -1).trim().toLowerCase());
  for (const b of brackets) {
    for (let i = 1; i <= 6 && !out.power; i++) {
      if (String(row['Power' + i] || '').trim().toLowerCase() === b.toLowerCase()) out.power = String(row['Power' + i] || '');
    }
    for (let i = 1; i <= 6 && !out.quality; i++) {
      if (String(row['Quality' + i] || '').trim().toLowerCase() === b.toLowerCase()) out.quality = String(row['Quality' + i] || '');
    }
  }
  return out;
}

// Min/Mid/Max inputs with Manual/Digital stacked on the right (the Effect Die
// field is gone — the ability's effect die is an internal calculation), then
// the Power/Quality dropdowns (locked when the ability forces them) and the
// current Status die beside them.
function diceBlockHtml(p, i) {
  const row = p.row || {};
  const forced = aysState.forced || {};
  const dieTag = v => 'd' + (parseInt(String(v || '').replace(/\D/g, ''), 10) || 0);
  const opt = (prefix, realName, die) => {
    const n = parseInt(String(die || '').replace(/\D/g, ''), 10) || 0;
    return `<option value="${esc(realName)}">${esc(realName)} (d${n})</option>`;
  };
  const powerOpts = [];
  const qualOpts = [];
  for (let i = 1; i <= 6; i++) {
    const pn = row['Power' + i], qn = row['Quality' + i];
    if (pn) powerOpts.push(opt('Power', pn, row['PowerDie' + i]));
    if (qn) qualOpts.push(opt('Quality', qn, row['QualityDie' + i]));
  }
  const lockP = forced.power ? ' disabled' : '';
  const lockQ = forced.quality ? ' disabled' : '';
  const selP = `<select id="aysPower_${i}"${lockP}>${powerOpts.join('')}</select>`;
  const selQ = `<select id="aysQuality_${i}"${lockQ}>${qualOpts.join('')}</select>`;
  if (forced.power) { setTimeout(() => { const s = document.getElementById('aysPower_' + i); if (s) s.value = forced.power; }, 0); }
  if (forced.quality) { setTimeout(() => { const s = document.getElementById('aysQuality_' + i); if (s) s.value = forced.quality; }, 0); }
  const bandL = currentBandLetter(p);
  const statusDie = (() => {
    const tokDie = dieTag(p.myToken && p.myToken.currentDie);
    const n = parseInt(String((p.myToken && p.myToken.currentDie) == null ? '' : p.myToken.currentDie).replace(/\D/g, ''), 10);
    if (n > 0) return tokDie;
    // same fallback as the header row: the hero's CSV status die for the band
    const col = { g: 'GreenStatusDie', y: 'YellowStatusDie', r: 'RedStatusDie', o: 'GreenStatusDie' }[bandL];
    return dieTag(row[col]) || '—';
  })();
  return `<div class="bd-row dice-block">
    <div class="dice-row pq-selects">
      <div><label>Power</label>${selP}</div>
      <div><label>Quality</label>${selQ}</div>
      <div class="status-cell" style="flex:0 0 auto;">
        <div class="muted" style="font-size:11px;">Status</div>
        <div class="die ${bandL}">${esc(statusDie)}</div>
      </div>
    </div>
    <div class="dice-row dice-entries" id="aysManualRow_${i}">
      <div><label>Min</label><input type="number" id="aysMin_${i}" min="0" value="0"></div>
      <div><label>Mid</label><input type="number" id="aysMid_${i}" min="0" value="0"></div>
      <div><label>Max</label><input type="number" id="aysMax_${i}" min="0" value="0"></div>
      <div class="roll-mode-stack">
        <label class="radio-line"><input type="radio" name="rollMode_${i}" value="manual" checked onchange="aysToggleRoll(${i})">Manual Roll</label>
        <label class="radio-line"><input type="radio" name="rollMode_${i}" value="digital" onchange="aysToggleRoll(${i})">Digital Roll</label>
      </div>
    </div>
    <div class="fineprint" id="aysDigitalNote_${i}" style="display:none;">Digital Roll: the server rolls your chosen Power + Quality + Status dice and computes Min/Mid/Max and the effect die itself.</div>
  </div>`;
}

function aysToggleRoll(i) {
  const manual = document.querySelector(`input[name="rollMode_${i}"]:checked`).value === 'manual';
  const row = document.getElementById('aysManualRow_' + i);
  if (row) row.style.opacity = manual ? '' : '.35';
  document.querySelectorAll(`#aysManualRow_${i} input[type=number]`).forEach(inp => { inp.disabled = !manual; });
}

function modTwistHtml(p, idx) {
  const row = p.row || {};
  const opts = [];
  for (const n of [1, 2]) {
    if (row['Principle' + n + 'MinorTwist']) {
      opts.push(`<option value="${n}">${esc(row['Principle' + n + 'Name'] || 'Principle ' + n)}: ${esc(row['Principle' + n + 'MinorTwist'])}</option>`);
    }
  }
  if (!opts.length) return '';
  return `<div class="bd-row"><div class="radio-line"><input type="checkbox" id="aysTwist_${idx}">
    <label for="aysTwist_${idx}" style="margin:0;display:inline;color:var(--text);"><b>Take a Minor Twist</b> — this mod lasts for TWO uses</label></div>
    <label>Which principle's twist</label><select id="aysTwistPrinciple_${idx}">${opts.join('')}</select></div>`;
}

function openEmergencySwitchStaged(p, ability) {
  aysState = { emergency: true, ability };
  showAys('Are You Sure? — Emergency Switch', `
    <div class="bd-row"><b>Reaction:</b> change to any mode when hit by an Attack.</div>
    <div class="bd-row">
      <label>New mode</label><select id="aysMode">${(p.modes || []).map(m =>
        `<option value="${esc(m.slug)}">${esc(m.name || m.slug)}</option>`).join('')}</select>
      <div class="radio-line" style="margin-top:8px;"><input type="radio" name="emgCost" value="damage" checked>
        <b>Cost:</b> take extra damage <input type="number" id="aysEmgDamage" min="0" value="0" style="width:80px;"></div>
      <div class="radio-line"><input type="radio" name="emgCost" value="twist"> Take a minor twist instead</div>
    </div>
    <div class="fineprint">On confirm the mode changes and the cost applies immediately.</div>
    <div id="aysOutcome"></div>
    <div class="foot">
      <button class="btn" onclick="closeAys()">Cancel</button>
      <button class="btn primary" onclick="confirmAys()">Confirm — Apply</button>
    </div>`);
}

function showAys(title, bodyHtml) {
  const old = document.getElementById('aysBackdrop');
  if (old) old.remove();
  const div = document.createElement('div');
  div.className = 'modal-backdrop';
  div.id = 'aysBackdrop';
  div.innerHTML = `<div class="ays"><h2>${title}</h2>${bodyHtml}</div>`;
  document.body.appendChild(div);
}

function closeAys() { aysState = null; aysInFlight = false; const el = document.getElementById('aysBackdrop'); if (el) el.remove(); }

function aysToggleRoll(i) {
  const manual = document.querySelector(`input[name="rollMode_${i}"]:checked`).value === 'manual';
  document.getElementById('aysManual_' + i).style.display = manual ? '' : 'none';
  document.getElementById('aysDigital_' + i).style.display = manual ? 'none' : '';
}

function aysBlockPayload(p, types) {
  const blocks = [];
  const errs = [];
  // ONE shared dice pool for the whole ability (all basic actions of one roll
  // share the same Min/Mid/Max + Power + Quality); only targets differ.
  const sharedRoll = (() => {
    const manual = document.querySelector('input[name="rollMode_0"]:checked').value === 'manual';
    if (manual) {
      const g = id => Number((document.getElementById(id) || {}).value) || 0;
      // No Effect Die entry — the ability (or Mid default) determines it server-side.
      return { manual: { min: g('aysMin_0'), mid: g('aysMid_0'), max: g('aysMax_0') } };
    }
    return { power: (document.getElementById('aysPower_0') || {}).value || '',
             quality: (document.getElementById('aysQuality_0') || {}).value || '' };
  })();
  types.forEach((t, i) => {
    const block = { type: t, roll: JSON.parse(JSON.stringify(sharedRoll)) };
    if (t === 'Overcome') {
      block.targetLabel = (document.getElementById('aysTargetLabel_' + i) || {}).value || 'scene object';
    } else {
      const sel = document.getElementById('aysTarget_' + i);
      if (!sel || !sel.value) { errs.push(t + ' needs a target'); return; }
      block.targetId = sel.value;
    }
    const tw = document.getElementById('aysTwist_' + i);
    if (tw && tw.checked) {
      block.boostTwist = { principle: Number((document.getElementById('aysTwistPrinciple_' + i) || {}).value) || 0 };
    }
    blocks.push(block);
  });
  // Mods are spent once, on the roll — attach to the first action.
  const spend = [...document.querySelectorAll('.ays-mod:checked')].map(el =>
    el.id.split('_').slice(2).join('_'));
  if (spend.length && blocks.length) blocks[0].spendMods = spend;
  return { blocks, errs };
}

async function confirmAys() {
  if (!aysState || aysInFlight) return;
  const p = lastPayload;
  const out = document.getElementById('aysOutcome');
  let payload = { hero: HERO, key: KEY };
  if (aysState.emergency) {
    const cost = (document.querySelector('input[name="emgCost"]:checked') || {}).value || 'damage';
    payload.kind = 'emergency-switch';
    payload.mode = (document.getElementById('aysMode') || {}).value || 'default';
    payload.cost = cost;
    if (cost === 'damage') payload.damage = Number((document.getElementById('aysEmgDamage') || {}).value) || 0;
  } else {
    const { blocks, errs } = aysBlockPayload(p, aysState.types);
    if (errs.length) { out.innerHTML = `<div class="outcome err">${esc(errs.join('; '))}</div>`; return; }
    payload.actions = blocks;
    payload.abilityName = aysState.ability ? (aysState.ability.DisplayName || aysState.ability.Name) : '';
    if (aysState.modeChange) {
      payload.modeChange = { position: aysState.modeChange.position,
                             mode: (document.getElementById('aysMode') || {}).value || 'default' };
    }
  }
  aysInFlight = true;
  const btn = document.getElementById('aysConfirmBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Applying…'; }
  try {
    const r = await fetch('/api/player-action', { method: 'POST',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const j = await r.json();
    if (!r.ok) {
      out.innerHTML = `<div class="outcome err"><b>Not applied:</b> ${esc(j.error || ('HTTP ' + r.status))}</div>`;
    } else {
      const lines = (j.outcomes || []).map(o => `<div>✅ ${esc(o.result || o.type)}</div>`).join('');
      // A Digital Roll's server-computed Min/Mid/Max lands back in the fields
      // that normally hold manual entry, so the roll is on the record.
      const roll = (j.outcomes || [])[0] && (j.outcomes || [])[0].roll;
      if (roll && roll.min != null) {
        const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = v; };
        set('aysMin_0', roll.min); set('aysMid_0', roll.mid); set('aysMax_0', roll.max);
        ['aysMin_0', 'aysMid_0', 'aysMax_0'].forEach(id => {
          const el = document.getElementById(id); if (el) el.disabled = true;
        });
      }
      out.innerHTML = `<div class="outcome">${lines || '<div>✅ Applied.</div>'}
        <div class="fineprint">Round ${esc(String(j.round || ''))}${j.currentMode ? ' · Mode: ' + esc(j.currentMode) : ''} — the board and change feed are updated.</div></div>`;
      const foot = document.querySelector('#aysBackdrop .foot');
      if (foot) foot.innerHTML = '<button class="btn primary" onclick="closeAys()">Done</button>';
      const fr = await fetchSheet();
      if (fr.status === 200) { lastPayload = fr.body; renderSheet(fr.body); }
    }
  } catch (e) {
    out.innerHTML = `<div class="outcome err">Request failed — try again.</div>`;
  }
  aysInFlight = false;
}

function pendingModsHtml(p) {
  const mods = p.pendingMods || [];
  if (!mods.length) return '<span class="muted">No Boost/Hinder waiting on you right now.</span>';
  return mods.map(m => `<div class="pending-mod">
    <b>${m.kind === 'boost' ? '+' : '−'}${m.value} ${esc(m.kind)}</b> from ${esc(m.creator)}
    <div class="pm-meta">${m.uses > 1 ? `${m.uses} uses — minor twist taken: “${esc(m.twist)}” · ` : ''}` +
    `created for you — you decide when to spend it, during one of your actions below.</div>
  </div>`).join('');
}

function abilityActionButtons(p, a) { return ''; }

// GYRO availability: a hero may only use abilities at or above their current
// status band — Green status: Green only; Yellow: Green+Yellow; Red: all but
// Out; Out: Out only. Returns false when the row is not clickable.
function bandAllowsZone(p, zone) {
  const cur = currentBandLetter(p); // 'g' | 'y' | 'r' | 'o'
  const z = String(zone || 'Green').toLowerCase();
  if (cur === 'g') return z === 'green';
  if (cur === 'y') return z === 'green' || z === 'yellow';
  if (cur === 'r') return z !== 'out';
  return z === 'out'; // Out: only Out abilities
}

function abilityRowClass(p, a) {
  return bandAllowsZone(p, a.Zone) ? ' clickable' : ' noclick';
}

let abilitiesByName = {};

function openAbilityAction(name) {
  const a = abilitiesByName[name] || null;
  if (!a) return;
  openActionStaged(rollTypesOf(a), a);
}

async function tick() {
  // Pause the poll while ANY decision surface is open so nothing under the
  // player's fingers ever resets: the Are-You-Sure modal and any confirm in
  // flight. (Notes edits are already preserved across re-renders, and the
  // abilities filter dropdown is guarded below.) Data catches up on the next
  // tick after the surface closes.
  if (aysState || aysInFlight || document.getElementById('aysBackdrop')) return;
  // Don't re-render while the abilities filter dropdown is open — replacing
  // the DOM would close it every 3s. Data catches up on the next tick.
  const sel = document.querySelector('.abil-filter select');
  if (sel && document.activeElement === sel) return;
  const r = await fetchSheet();
  const p = r.body || {};
  if (r.status === 403) {
    document.getElementById('gate').innerHTML = '<h1>Hero Sheet</h1><p>This link is not valid (or was reset by the GM). Ask for a fresh link.</p>';
    return;
  }
  if (r.status === 404) {
    document.getElementById('gate').innerHTML = '<h1>Hero Sheet</h1><p>Hero not found in the campaign.</p>';
    return;
  }
  document.getElementById('gate').style.display = 'none';
  // 'flex' (not 'block') — the inline style must match the tablet layout's
  // flex-column wrapper or the inline value overrides it and scrolling breaks
  document.getElementById('sheet').style.display = 'flex';
  // Re-render only when the server payload actually changed — an unchanged
  // poll must never touch the DOM (this is the scroll/focus/dropdown-reset
  // fix); the snapshot/restore inside renderSheet covers the renders that do.
  const pj = JSON.stringify(p);
  if (pj === lastSheetJson) return;
  lastSheetJson = pj;
  lastPayload = p;
  renderSheet(p);
}

// --- Live updates: SSE push with polling fallback ---------------------------
// The server streams its campaign-data version on /api/events; tick() runs the
// moment it changes (coalesced, and still guarded by the AYS/focus checks at
// the top of tick). The 3s interval remains ONLY as a fallback while the
// stream is down (EventSource reconnects itself).
let lastSheetJson = '';
let sheetSseOpen = false;
let sheetPollTimer = null;
function connectEvents() {
  try {
    const es = new EventSource('/api/events');
    es.onopen = () => { sheetSseOpen = true; };
    es.onerror = () => { sheetSseOpen = false; };
    es.onmessage = () => {
      if (sheetPollTimer) return;
      sheetPollTimer = setTimeout(() => { sheetPollTimer = null; tick(); }, 100);
    };
  } catch (e) { /* no EventSource — the interval fallback drives everything */ }
}
connectEvents();
tick();
setInterval(() => { if (!sheetSseOpen) tick(); }, 3000);
loadReminders();
</script>
