<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Sheet — SCRPG</title>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<style>
  :root {
    --bg: #12121c; --panel: #1b1b2a; --panel-2: #222236; --line: #34344e;
    --text: #e8e8f2; --text-lo: #9a9ab2; --accent: #4f8cff; --gold: #ffd76a;
    --green: #35c26e; --yellow: #e8c53a; --red: #e05555;
    --hero: #2454E8; --villain: #6e0b0b; --minion: #9a8c00; --lieutenant: #b45309;
    --font-display: 'Bangers', cursive; --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 15px; }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 400; letter-spacing: .5px; margin: 0; }
  button { font-family: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 14px 14px 60px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  .card h2 { font-size: 22px; color: var(--accent); margin-bottom: 8px; }
  .muted { color: var(--text-lo); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  /* Tablet layout (only layout): 16:9 viewport fit — header on top, 3 columns
     filling the rest, each column scrolling independently */
  body.tablet { overflow: hidden; height: 100vh; }
  body.tablet .wrap { height: 100vh; max-width: none; display: flex; flex-direction: column; padding: 10px 12px 12px; }
  body.tablet .wrap > .header-wrap { flex: 0 0 auto; margin-bottom: 12px; }
  body.tablet .sheet-grid { flex: 1 1 auto; min-height: 0; align-items: stretch; grid-template-rows: minmax(0, 1fr); }
  body.tablet .sheet-col { overflow-y: auto; height: 100%; min-height: 0; padding-right: 2px; }

  /* 3-column layout under the header — tracks are minmax(0,1fr) so no card's
     min-content can ever push a column into its neighbor (fully separated) */
  .sheet-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  .sheet-col { min-width: 0; overflow: hidden; }
  .pq-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
  .pq-pair .card { margin-bottom: 14px; min-width: 0; overflow: hidden; }
  .collapsible-head { cursor: pointer; user-select: none; display: flex; justify-content: space-between; align-items: center; }
  .collapsible-head .chev { color: var(--text-lo); font-size: 14px; font-family: var(--font-body); }
  @media (max-width: 940px) { .sheet-grid { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 560px) { .pq-pair { grid-template-columns: minmax(0, 1fr); } }

  /* header row: 4 Location-scale hero tokens OUTSIDE the header, horizontally,
     pushing the header right. Tokens keep Location card size; header keeps
     its own height. */
  .header-wrap { display: flex; gap: 12px; align-items: flex-start; }
  .header-wrap > .card { flex: 1; min-width: 0; margin-bottom: 0; }
  .header-heroes { display: flex; gap: 10px; flex: 0 0 auto; }
  /* Fixed header height shared by the token cards and the header card — only
     the header card's WIDTH ever changes. */
  .header-wrap { --header-h: 170px; }
  .header-heroes .occ-card { flex: 0 0 138px; width: 138px; min-width: 138px; max-width: 138px;
                             height: var(--header-h); overflow: hidden; padding: 0 0 2px; }
  .header-heroes .occ-card .o-art { width: 100%; aspect-ratio: 1/1;
                                    background-size: contain; background-position: center;
                                    border-radius: 6px 6px 0 0; }
  .header-heroes .occ-card .o-name { margin-top: 2px; }
  .header-heroes .occ-card .o-hp { margin-top: 0; padding-bottom: 0; }
  .header-wrap > .card { height: var(--header-h); overflow: hidden; }
  /* identity header */
  .id-head { display: flex; gap: 14px; align-items: stretch; }
  .id-center { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .portrait { width: calc(var(--header-h, 170px) - 32px); height: calc(var(--header-h, 170px) - 32px);
              border-radius: 12px; border: 3px solid var(--hero);
              background: var(--panel-2) center/cover no-repeat; flex: 0 0 auto; }
  /* Name/Alias/Player stay on one row beside the image even when the header
     narrows — the type scales, the position does not. */
  .id-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: nowrap; min-width: 0; }
  .id-name { font-size: clamp(16px, 2.6vw, 30px); line-height: 1.05; }
  .id-alias { font-size: clamp(12px, 1.3vw, 16px); color: var(--gold); }
  .id-player { font-size: clamp(10px, 1vw, 13px); color: var(--text-lo); white-space: nowrap; }
  .health-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .health-bar { flex: 1; height: 12px; border-radius: 6px; background: #0d0d16; overflow: hidden; border: 1px solid var(--line); }
  .health-fill { height: 100%; transition: width .3s; }
  .health-fill.green { background: var(--green); } .health-fill.yellow { background: var(--yellow); }
  .health-fill.red { background: var(--red); } .health-fill.out { background: #555; }
  .health-nums { font-size: 12.5px; color: var(--text-lo); white-space: nowrap; }

  /* scene tracker + status dice */
  .track-status { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .tracker { display: flex; gap: 3px; align-items: center; }
  .tracker .star { width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--line); background: #0d0d16; opacity: .45; }
  .tracker .star.green { background: var(--green); } .tracker .star.yellow { background: var(--yellow); }
  .tracker .star.red { background: var(--red); }
  .tracker .star.here { opacity: 1; outline: 2px solid #fff; outline-offset: 1px; }
  .track-label { font-size: 10px; color: var(--text-lo); text-transform: uppercase; letter-spacing: 1px; margin-right: 4px; }
  .status-row { display: flex; gap: 3px; }
  .status-cell { width: 50px; text-align: center; background: var(--panel-2);
                 border: 1px solid var(--line); border-radius: 8px; padding: 4px 2px; position: relative; }
  .status-cell .die { font-family: var(--font-display); font-size: 16px; }
  .status-cell .die.g { color: var(--green); } .status-cell .die.y { color: var(--yellow); }
  .status-cell .die.r { color: var(--red); } .status-cell .die.o { color: #777; }
  .status-cell.masked::after { content: ''; position: absolute; inset: 0; border-radius: 8px;
                               background: rgba(0,0,0,.3); }
  .status-cell.current { border-width: 2px; border-color: var(--gold); }

  /* dice grids */
  .pq-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .pq { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
        display: flex; justify-content: space-between; align-items: center; gap: 8px; min-width: 0; }
  .pq > span:first-child { min-width: 0; overflow-wrap: anywhere; font-size: clamp(11px, 1.1vw, 14px); }
  .pq .die { font-family: var(--font-display); font-size: clamp(15px, 1.5vw, 20px); color: var(--gold); flex: 0 0 auto; }

  /* abilities */
  .abil-filter { margin-bottom: 8px; }
  .abil { border-left: 4px solid var(--line); background: var(--panel-2); border-radius: 6px;
          padding: 8px 10px; margin-bottom: 8px; }
  .abil.z-Green { border-left-color: var(--green); } .abil.z-Yellow { border-left-color: var(--yellow); }
  .abil.z-Red { border-left-color: var(--red); } .abil.z-Out { border-left-color: #777; }
  .abil .a-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .abil .a-name { font-weight: 600; }
  .abil .a-zone { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-lo); }
  .abil .a-text { margin-top: 4px; font-size: 13.5px; color: #cfcfde; white-space: pre-wrap; }
  .abil .a-meta { margin-top: 4px; font-size: 12px; color: var(--text-lo); }

  /* principles */
  .principle { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
  .principle .p-name { font-weight: 600; color: var(--gold); }
  .principle .p-line { font-size: 13px; margin-top: 4px; }
  .principle .p-line b { color: var(--text-lo); font-weight: 600; }

  /* location viewer */
  .loc-name { font-size: 24px; color: #4169E1; text-align: center; }
  .occ { display: flex; gap: 10px; flex-wrap: wrap; }
  .occ-card { flex: 1; min-width: 130px; max-width: 170px; background: var(--panel-2);
              border: 2px solid var(--line); border-radius: 10px; padding: 8px; text-align: center; }
  .occ-card.hero { border-color: var(--hero); } .occ-card.villain { border-color: var(--villain); }
  .occ-card.minion { border-color: var(--minion); } .occ-card.lieutenant { border-color: var(--lieutenant); }
  .occ-card.npc { border-color: #7a7a8a; }
  .occ-card .o-art { width: 100%; aspect-ratio: 1/1; border-radius: 8px; background: #0d0d16 center/cover no-repeat; }
  .occ-card .o-name { margin-top: 6px; font-weight: 600; font-size: 13px; }
  .occ-card .o-die { color: var(--gold); font-family: var(--font-display); }
  .occ-card .o-hp { font-size: 11px; color: var(--text-lo); }

  /* notes */
  textarea { width: 100%; min-height: 160px; background: #0d0d16; color: var(--text);
             border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-family: inherit; font-size: 14px; resize: vertical; }
  .btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2);
         color: var(--text); cursor: pointer; font-size: 14px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  /* alerts */
  .alert-banner { border: 2px solid var(--gold); background: #2a2410; color: var(--gold);
                  border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
  .alert-banner .a-ts { font-size: 11px; color: var(--text-lo); margin-top: 6px; }
  .alert-banner .btn { margin-top: 8px; }
  .alert-hist { border-left: 3px solid var(--line); padding: 6px 10px; margin-bottom: 6px; font-size: 13.5px; }
  .alert-hist .a-ts { font-size: 11px; color: var(--text-lo); }

  /* misc */
  .hint-reminders { font-size: 12.5px; color: var(--text-lo); margin-top: 8px; line-height: 1.5; }
  #gate { text-align: center; padding-top: 18vh; }
  #gate h1 { font-size: 42px; color: var(--accent); }
  .hp-dots { font-size: 24px; letter-spacing: 4px; }
  .save-status { font-size: 12px; color: var(--text-lo); margin-left: 8px; }
  @media (max-width: 560px) { .id-head { flex-direction: column; } .portrait { width: 84px; height: 84px; } }
</style>
</head>
<body>

<div id="gate" class="wrap">
  <h1>Hero Sheet</h1>
  <p class="muted">Opening your sheet…</p>
</div>

<div id="sheet" class="wrap" style="display:none;"></div>

<script>
'use strict';
const params = new URLSearchParams(location.search);
const HERO = params.get('hero') || '';
const KEY = params.get('key') || '';

// Tablet layout is the only layout (16:9 viewport fit).
document.body.classList.add('tablet');

let lastPayload = null;
let notesDirty = false;

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function dieNum(d) { const n = parseInt(String(d || '').replace(/\D/g, ''), 10); return isNaN(n) ? 0 : n; }

// Health band from current/max health: green >50%, yellow 11-50%, red 1-10%, out at 0.
function healthBand(cur, max) {
  const c = Number(cur), m = Number(max);
  if (!isFinite(c) || !isFinite(m) || m <= 0) return 'green';
  if (c <= 0) return 'out';
  const pct = c / m * 100;
  if (pct > 50) return 'green';
  if (pct >= 11) return 'yellow';
  if (pct >= 1) return 'red';
  return 'out';
}

const BAND_ORDER = { green: 0, yellow: 1, red: 2, out: 3 };
function worseBand(a, b) { return (BAND_ORDER[a] ?? 0) >= (BAND_ORDER[b] ?? 0) ? a : b; }
function bandLetter(b) { return b === 'green' ? 'g' : b === 'yellow' ? 'y' : b === 'red' ? 'r' : 'o'; }

function portraitUrl(kind, slug) {
  const pk = kind === 'hero' ? 'hero' : kind === 'villain' ? 'villain' : 'minion';
  return '/api/backgrounds/portrait-' + pk + '-' + encodeURIComponent(slug);
}

// Effective group for sorting occupants. 0 villains, 1 lieutenants, 2 minions,
// 3 bystanders, 4 players (self is excluded before this runs).
function occGroup(t) {
  const k = t.kind || '';
  if (k === 'villain') return 0;
  if (k === 'lieutenant' || (k === 'npc' && t.npcType === 'Lieutenant')) return 1;
  if (k === 'minion' || (k === 'npc' && t.npcType === 'Minion')) return 2;
  if (k === 'npc' && t.npcType === 'Bystander') return 3;
  return 4;
}
const OCC_GROUP_CLASS = { 0: 'villain', 1: 'lieutenant', 2: 'minion', 3: 'npc', 4: 'hero' };

function sortedOccupants(list) {
  return (list || [])
    .filter(t => t.slug !== HERO)
    .map(t => ({ t, g: occGroup(t), name: String(t.name || '') }))
    .sort((a, b) => a.g - b.g || a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
}

function fetchSheet() {
  return fetch(`/api/player-sheet?hero=${encodeURIComponent(HERO)}&key=${encodeURIComponent(KEY)}`)
    .then(r => r.json().then(j => ({ status: r.status, body: j })));
}

// ---- sorting helpers (highest die first, alphabetical on ties) ----
function pqSorted(row, prefix, count) {
  const out = [];
  for (let i = 1; i <= count; i++) {
    const name = row[prefix + i] || '';
    if (!name) continue;
    out.push({ name: String(row[prefix + i + 'DisplayName'] || name), die: row[prefix + 'Die' + i] || '' });
  }
  out.sort((a, b) => dieNum(b.die) - dieNum(a.die) || a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
  return out;
}

const ZONE_ORDER = { Green: 0, Yellow: 1, Red: 2, Out: 3 };
function isPrincipleAbility(a) { return /^principle\b/i.test(String(a.Name || '')); }
function abilitiesSorted(list) {
  return (list || []).slice().sort((a, b) => {
    const za = ZONE_ORDER[a.Zone || 'Green'] ?? 9, zb = ZONE_ORDER[b.Zone || 'Green'] ?? 9;
    if (za !== zb) return za - zb;
    if (za === 0) { // principles sink to the bottom of Green
      const pa = isPrincipleAbility(a) ? 1 : 0, pb = isPrincipleAbility(b) ? 1 : 0;
      if (pa !== pb) return pa - pb;
    }
    const na = String(a.DisplayName || a.Name || ''), nb = String(b.DisplayName || b.Name || '');
    return na.localeCompare(nb, undefined, { sensitivity: 'base' });
  });
}

function modesOf(list) {
  const modes = new Set();
  (list || []).forEach(a => { const m = String(a.Mode || '').trim(); if (m) modes.add(m); });
  return [...modes].sort();
}

// ---- section renderers ----
function pqGridHtml(row, prefix, count) {
  const items = pqSorted(row, prefix, count);
  return items.map(it => `<div class="pq"><span>${esc(it.name)}</span><span class="die">${esc(it.die)}</span></div>`).join('')
    || '<span class="muted">None recorded.</span>';
}

function trackerColor(p) {
  const tr = p.tracker;
  if (!tr || !tr.stars || !tr.stars.length) return 'green';
  const pos = Math.max(0, Math.min(tr.stars.length - 1, Number(tr.position) || 0));
  return tr.stars[pos] || 'green';
}

function trackerHtml(p) {
  const tr = (p.tracker && p.tracker.stars) ? p.tracker : null;
  if (!tr || !tr.stars || !tr.stars.length) return '<span class="muted" style="font-size:12px;">No scene tracker.</span>';
  const pos = Math.max(0, Math.min(tr.stars.length - 1, Number(tr.position) || 0));
  const stars = tr.stars.map((c, i) => `<span class="star ${esc(c)} ${i === pos ? 'here' : ''}"></span>`).join('');
  return `<div class="tracker"><span class="track-label">Scene Tracker</span>${stars}</div>`;
}

function statusRowHtml(p) {
  const row = p.row || {};
  const hp = healthBand(p.myToken && p.myToken.currentHealth, p.myToken && p.myToken.maxHealth);
  const trColor = trackerColor(p);
  // Hero status = the worse of personal health band and the scene tracker color (RAW).
  const cur = (p.myToken && p.myToken.maxHealth) ? worseBand(hp, trColor) : 'green';
  const curL = bandLetter(cur);
  return ['g', 'y', 'r'].map(l => {
    const key = l === 'g' ? 'GreenStatusDie' : l === 'y' ? 'YellowStatusDie' : 'RedStatusDie';
    const dieVal = l === curL ? (p.myToken && p.myToken.currentDie) || row[key] || '—' : (row[key] || '—');
    return `<div class="status-cell ${l === curL ? 'current' : 'masked'}">
      <div class="muted" style="font-size:11px;">${l === 'g' ? 'Green' : l === 'y' ? 'Yellow' : 'Red'}</div>
      <div class="die ${l}">${esc(dieVal)}</div>
    </div>`;
  }).join('');
}

function currentBandLetter(p) {
  const hp = healthBand(p.myToken && p.myToken.currentHealth, p.myToken && p.myToken.maxHealth);
  const cur = (p.myToken && p.myToken.maxHealth) ? worseBand(hp, trackerColor(p)) : 'green';
  return bandLetter(cur);
}

const SWITCH_ABILITIES = ['switch', 'quick switch', 'emergency switch'];

// Mode-aware ability filtering.
//  - 'all': everything.
//  - 'status': cumulative availability (G -> G, Y -> G+Y, R -> all but Out),
//    and ALWAYS excludes mode-specific rows — a hero only has their mode's
//    abilities while IN that mode. Default-mode (Mode blank) rows only.
//  - 'mode:<slug>': strict membership from the hero's ## Modes JSON — that
//    mode's picked powers + principles + the Switch family (+ Out).
//    Powerless modes suppress every ability card.
function abilitiesForFilter(p, filter, all) {
  if (filter === 'all') return all;
  if (filter === 'status') {
    const rank = { Green: 0, Yellow: 1, Red: 2 };
    const curRank = rank[currentBandLetter(p) === 'g' ? 'Green' : currentBandLetter(p) === 'y' ? 'Yellow' : 'Red'] ?? 0;
    return all.filter(a => !(a.Mode || '').trim() && (rank[a.Zone || 'Green'] ?? 3) <= curRank);
  }
  const slug = String(filter).replace(/^mode:/, '');
  const mode = (p.modes || []).find(m => String(m.slug || '') === slug);
  if (!mode) return all.filter(a => !(a.Mode || '').trim());
  if (mode.powerless) return [];
  if (slug === 'default') return all.filter(a => !(a.Mode || '').trim());
  const powerNames = new Set(Object.keys(mode.powers || {}).map(n => String(n).toLowerCase()));
  return all.filter(a => {
    const am = String(a.Mode || '').trim();
    if (am === slug) return true;
    if (am) return false;
    const n = String(a.Name || '').toLowerCase();
    return powerNames.has(n) || /^principle\b/.test(n) || SWITCH_ABILITIES.includes(n) || n === 'out';
  });
}

function modeButtonLabel(m) {
  const name = String(m.name || m.slug || '').replace(/\bmodular\b/ig, '').replace(/\s+/g, ' ').trim();
  return (name || String(m.slug)) + (/mode$/i.test(name) ? '' : ' Mode');
}

function switchToMode(slug) {
  // VIEW-ONLY: clicking a mode filter shows that mode's abilities. Switching
  // the hero's actual mode is only allowed through an ability that grants it
  // (Switch / Quick Switch / Emergency Switch — built in Phase 2 on top of
  // /api/player-mode, which stays server-gated for that flow).
  window.__abilFilter = 'mode:' + slug;
  renderSheet(lastPayload);
}

function bhdRowHtml(p) {
  const bhd = (p.myToken && p.myToken.bhd) || {};
  const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
  const boost = num(bhd.boost), hinder = num(bhd.hinder), defend = num(bhd.defend);
  const cells = [
    ['Boost', boost >= 0 ? '+' + boost : String(boost)],
    ['Hinder', hinder >= 0 ? '−' + hinder : '+' + Math.abs(hinder)],
    ['Defend', defend >= 0 ? '+' + defend : String(defend)],
  ];
  return cells.map(([label, val]) => `
    <div class="status-cell">
      <div class="muted" style="font-size:11px;">${label}</div>
      <div class="die o">${esc(val)}</div>
    </div>`).join('');
}

function typeLetter(a) {
  const t = String(a.Type || '').trim().toUpperCase();
  return ['A', 'I', 'R'].includes(t) ? t : '';
}

function abilitiesHtml(p) {
  const isModular = (p.modes || []).length > 0;
  if (isModular && window.__abilFilter === undefined) window.__abilFilter = 'mode:' + (p.currentMode || 'default');
  const filter = (window.__abilFilter === undefined ? 'all' : window.__abilFilter);
  const all = abilitiesSorted(p.abilities);
  const shown = abilitiesForFilter(p, filter, all);
  const curMode = String(p.currentMode || 'default');
  let filterUi;
  if (isModular) {
    // Modular heroes: All + Status BUTTONS, plus a separate dropdown for the
    // modes ONLY (that's the part that saves room).
    const modeOptions = p.modes.map(m => {
      const slug = String(m.slug || '');
      return `<option value="mode:${esc(slug)}" ${filter === 'mode:' + slug ? 'selected' : ''}>${esc(modeButtonLabel(m))}</option>`;
    }).join('');
    filterUi = `<div class="abil-filter row">
        <button class="btn ${filter === 'all' ? 'primary' : ''}" onclick="setAbilFilter('all')">All</button>
        <button class="btn ${filter === 'status' ? 'primary' : ''}" onclick="setAbilFilter('status')">Status</button>
        <select class="scene-difficulty-select" onchange="setAbilFilter(this.value)">
          <option value="" disabled ${filter.startsWith('mode:') ? '' : 'selected'}>Modes…</option>
          ${modeOptions}
        </select>
      </div>`;
  } else {
    filterUi = `<div class="abil-filter row">
        <button class="btn ${filter === 'all' ? 'primary' : ''}" onclick="setAbilFilter('all')">All</button>
        <button class="btn ${filter === 'status' ? 'primary' : ''}" onclick="setAbilFilter('status')">Status</button>
      </div>`;
  }
  const rows = shown.map(a => {
    const t = typeLetter(a);
    const roll = String(a.RollType || '').trim();
    const title = [t, esc(a.DisplayName || a.Name), esc(roll)].filter(Boolean).join(' - ');
    const meta = [a.DieSource ? 'Source: ' + a.DieSource : ''].filter(Boolean).map(esc).join(' · ');
    return `
    <div class="abil z-${esc(a.Zone || 'Green')}">
      <div class="a-head"><span class="a-name">${title}</span></div>
      <div class="a-text">${esc(a.GameText || '')}</div>
      ${meta ? `<div class="a-meta">${meta}</div>` : ''}
    </div>`;
  }).join('');
  return filterUi + (rows || '<span class="muted">No abilities in this view.</span>');
}

function setAbilFilter(f) { window.__abilFilter = f; renderSheet(lastPayload); }

// Location card is collapsible; state survives the 3s poll re-renders.
let locOpen = false;
function toggleLocationCard() {
  locOpen = !locOpen;
  const box = document.getElementById('locBox');
  const chev = document.getElementById('locChev');
  if (box) box.style.display = locOpen ? 'block' : 'none';
  if (chev) chev.textContent = locOpen ? '▾' : '▸';
}

function principlesHtml(row) {
  const out = [];
  for (const n of [1, 2]) {
    const name = row['Principle' + n + 'Name'] || '';
    if (!name) continue;
    out.push(`<div class="principle">
      <div class="p-name">${esc(name)}</div>
      ${row['Principle' + n + 'Roleplay'] ? `<div class="p-line"><b>Roleplay:</b> ${esc(row['Principle' + n + 'Roleplay'])}</div>` : ''}
      ${row['Principle' + n + 'MinorTwist'] ? `<div class="p-line"><b>Minor Twist:</b> ${esc(row['Principle' + n + 'MinorTwist'])}</div>` : ''}
      ${row['Principle' + n + 'MajorTwist'] ? `<div class="p-line"><b>Major Twist:</b> ${esc(row['Principle' + n + 'MajorTwist'])}</div>` : ''}
    </div>`);
  }
  return out.join('') || '<span class="muted">No principles recorded.</span>';
}

function occupantsHtml(p) {
  if (!p.location || !p.location.name) return '<span class="muted">You are not on the board yet. The GM will place you when the scene starts.</span>';
  // Players live in the header now; the Location card shows everyone else.
  const cards = sortedOccupants(p.occupants).filter(x => x.g !== 4).map(({ t, g }) => {
    let hpLine = '';
    if (t.kind !== 'villain' && t.currentHealth != null && t.maxHealth) {
      hpLine = `<div class="o-hp">Health ${t.currentHealth}/${t.maxHealth}</div>`;
    } else if (t.kind === 'villain') {
      hpLine = '<div class="o-hp">Health ???</div>';
    }
    return `<div class="occ-card ${OCC_GROUP_CLASS[g]}">
      <div class="o-art" style="background-image:url('${esc(portraitUrl(t.kind, t.slug))}')"></div>
      <div class="o-name">${esc(t.name)}</div>
      <div class="o-die">${esc(t.currentDie || '')}</div>
      ${hpLine}
    </div>`;
  }).join('');
  return `<div class="loc-name">${esc(p.location.name)}</div><div class="occ">${cards || '<span class="muted">Nobody else here.</span>'}</div>`;
}

function alertsHtml(p) {
  const active = (p.alerts || []).filter(a => !a.dismissed);
  const hist = (p.alerts || []).filter(a => a.dismissed).slice().reverse();
  const banners = active.map(a => `
    <div class="alert-banner">
      <div>📩 ${esc(a.text)}</div>
      <div class="a-ts">From the GM · ${esc(a.ts || '')}</div>
      <button class="btn" onclick="dismissAlert('${esc(a.id)}')">Dismiss</button>
    </div>`).join('');
  const history = hist.length ? `<div style="margin-top:6px;"><h3 style="font-size:16px;color:var(--text-lo);">Alert history</h3>` +
    hist.map(a => `<div class="alert-hist">${esc(a.text)}<div class="a-ts">${esc(a.ts || '')}</div></div>`).join('') + '</div>' : '';
  return banners + history;
}

function hpDots(n) {
  return '<span class="hp-dots">' + '●'.repeat(n) + '<span style="color:#444;">' + '●'.repeat(Math.max(0, 5 - n)) + '</span></span>';
}

function headerHeroesHtml(p) {
  // Location-card build at 1:1 scale: image, name, health.
  const heroes = sortedOccupants(p.occupants).filter(x => x.g === 4).slice(0, 4);
  return heroes.map(({ t }) => {
    let hpLine = '';
    if (t.currentHealth != null && t.maxHealth) hpLine = `<div class="o-hp">Health ${t.currentHealth}/${t.maxHealth}</div>`;
    return `<div class="occ-card hero">
      <div class="o-art" style="background-image:url('${esc(portraitUrl(t.kind, t.slug))}')"></div>
      <div class="o-name">${esc(t.name)}</div>
      ${hpLine}
    </div>`;
  }).join('');
}

function renderSheet(p) {
  if (!p || p.error) return;
  const row = p.row || {};
  // preserve an in-progress note edit across re-renders (the 3s poll re-renders)
  const prevTa = document.getElementById('notesArea');
  const prevNotes = prevTa && notesDirty ? prevTa.value : null;
  const band = healthBand(p.myToken && p.myToken.currentHealth, p.myToken && p.myToken.maxHealth);
  // preserve each column's scroll position across the 3s poll re-render
  const prevScrolls = [...document.querySelectorAll('.sheet-col')].map(c => c.scrollTop);
  const hp = p.heroPoints || {};
  const curHP = p.myToken && p.myToken.currentHealth != null ? p.myToken.currentHealth : null;
  const maxHP = p.myToken && p.myToken.maxHealth != null ? p.myToken.maxHealth : (Number(row.MaxHealth) || null);
  const hpPct = curHP != null && maxHP ? Math.max(0, Math.min(100, curHP / maxHP * 100)) : 0;
  document.getElementById('sheet').innerHTML = `
    <div class="header-wrap">
      <div class="header-heroes">${headerHeroesHtml(p)}</div>
      <div class="card">
        <div class="id-head">
          <div class="portrait" id="portraitBox" style="background-image:url('${esc(portraitUrl('hero', HERO))}')"></div>
          <div class="id-center">
            <div class="id-row">
              <h1 class="id-name">${esc(row.Name || '')}</h1>
              <span class="id-alias">${esc(row.Alias || '')}</span>
              <span class="id-player">${esc(row.Player || '')}</span>
            </div>
            <div class="health-row">
              <div class="health-bar"><div class="health-fill ${band}" style="width:${hpPct}%"></div></div>
              <span class="health-nums">Current ${curHP != null ? curHP : '—'} / Max ${maxHP != null ? maxHP : '—'}</span>
            </div>
            <div class="track-status">
              ${trackerHtml(p)}
              <div class="status-row">${statusRowHtml(p)}</div>
              <div class="status-row">${bhdRowHtml(p)}</div>
            </div>
          </div>
          <div style="flex:0 0 90px;"></div>
        </div>
      </div>
    </div>

    <div class="sheet-grid">
      <div class="sheet-col">
        <div class="pq-pair">
          <div class="card"><h2>Powers</h2><div class="pq-grid">${pqGridHtml(row, 'Power', 6)}</div></div>
          <div class="card"><h2>Qualities</h2><div class="pq-grid">${pqGridHtml(row, 'Quality', 6)}</div></div>
        </div>
        <div class="card"><h2>Principles &amp; Twists</h2>${principlesHtml(row)}</div>
      </div>

      <div class="sheet-col">
        <div id="alertsBox">${alertsHtml(p)}</div>
        <div class="card"><h2>Abilities</h2><div id="abilList">${abilitiesHtml(p)}</div></div>
      </div>

      <div class="sheet-col">
        <div class="card"><h2>Notes</h2>
          <textarea id="notesArea" placeholder="Type Session Notes, Personal Notes, or Reminders Here...">${esc(p.notes || '')}</textarea>
          <div class="row" style="margin-top:8px;">
            <button class="btn primary" id="notesSaveBtn" onclick="saveNotes()">Save Notes</button>
            <span class="save-status" id="notesStatus"></span>
          </div>
        </div>
        <div class="card"><h2>Hero Points — ${esc(hp.issue || 'this Issue')}</h2>
          <div style="display:flex;justify-content:space-between;align-items:center;">
            ${hpDots(hp.mine || 0)}
            <span style="font-size:15px;color:var(--text-lo);">${hp.mine || 0} / 5</span>
          </div>
        </div>
        <div class="card">
          <h2 class="collapsible-head" onclick="toggleLocationCard()">Location <span class="chev" id="locChev">${locOpen ? '▾' : '▸'}</span></h2>
          <div id="locBox" style="display:${locOpen ? 'block' : 'none'};">${occupantsHtml(p)}</div>
        </div>
      </div>
    </div>
  `;
  const ta = document.getElementById('notesArea');
  if (prevNotes !== null) ta.value = prevNotes;
  ta.addEventListener('input', () => { notesDirty = true; });
  // restore column scroll positions after the re-render
  document.querySelectorAll('.sheet-col').forEach((c, i) => { if (prevScrolls[i]) c.scrollTop = prevScrolls[i]; });
}

async function saveNotes() {
  const ta = document.getElementById('notesArea');
  const st = document.getElementById('notesStatus');
  st.textContent = 'Saving…';
  try {
    const r = await fetch('/api/player-notes', { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ hero: HERO, key: KEY, text: ta.value }) });
    if (!r.ok) throw new Error('bad status');
    notesDirty = false;
    st.textContent = 'Saved ✓';
    setTimeout(() => { const s = document.getElementById('notesStatus'); if (s) s.textContent = ''; }, 4000);
  } catch (e) {
    st.textContent = 'Save failed — try again.';
  }
}

async function dismissAlert(id) {
  await fetch('/api/alerts', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ op: 'dismiss', hero: HERO, key: KEY, id }) });
  const r = await fetchSheet();
  if (r.status === 200) { lastPayload = r.body; renderSheet(r.body); }
}

async function tick() {
  // Don't re-render while the abilities filter dropdown is open — replacing
  // the DOM would close it every 3s. Data catches up on the next tick.
  const sel = document.querySelector('.abil-filter select');
  if (sel && document.activeElement === sel) return;
  const r = await fetchSheet();
  const p = r.body || {};
  if (r.status === 403) {
    document.getElementById('gate').innerHTML = '<h1>Hero Sheet</h1><p>This link is not valid (or was reset by the GM). Ask for a fresh link.</p>';
    return;
  }
  if (r.status === 404) {
    document.getElementById('gate').innerHTML = '<h1>Hero Sheet</h1><p>Hero not found in the campaign.</p>';
    return;
  }
  document.getElementById('gate').style.display = 'none';
  // 'flex' (not 'block') — the inline style must match the tablet layout's
  // flex-column wrapper or the inline value overrides it and scrolling breaks
  document.getElementById('sheet').style.display = 'flex';
  lastPayload = p;
  renderSheet(p);
}

tick();
setInterval(tick, 3000);
</script>
</body>
</html>
