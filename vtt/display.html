<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCRPG — Player Display</title>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="style.css">
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--ink);
  }
  .display-header { display:none; }
  #displayFrame {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  #displayStage {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    box-sizing: border-box;
    padding: 1vh 2vw 1.2vh;
  }
  .display-tracker-center {
    text-align: center;
    padding: 0;
    margin: 0;
    flex: 0 0 auto;
  }
  .display-tracker-center h1 {
    font-family: var(--font-display);
    font-size: clamp(28px, 4.2vh, 64px);
    letter-spacing: 0.04em;
    margin: 0;
    line-height: 1.1;
  }
  .display-tracker-wrap {
    padding: 0.3vh 0 10px;
    display: flex;
    justify-content: center;
    flex: 0 0 auto;
  }
  .tracker-star { width: clamp(22px, 3.4vh, 48px); height: clamp(22px, 3.4vh, 48px); font-size: clamp(16px, 2.6vh, 36px); }
  #displayEnvironment {
    margin: 0;
    padding: 0;
    border: none;
    background: none;
    justify-content: center;
    flex: 0 0 auto;
  }
  #displayEnvironment:empty { display: none; }
  #displayEnvironment .env-name { font-size: 1.6vh; }
  .display-main.view {
    padding: 0;
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    overflow: hidden;
  }
  .locations-row { flex: 1 1 auto; min-height: 0; gap: 1vh; }
  .location-block { margin: 0; }
  .location-header {
    font-family: var(--font-display);
    font-size: clamp(22px, 3.4vh, 48px);
    letter-spacing: 0.06em;
    margin: 0 0 0.4vh;
    color: var(--accent);
    line-height: 1.1;
  }
  .location-name-display { font-size: clamp(22px, 3.4vh, 48px); letter-spacing: 0.06em; }
  .empty-display { padding: 8vh 2vw; text-align: center; font-family: var(--font-display); font-size: 3vh; color: var(--text-lo); }
  .mvc-stage {
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    gap: 0.7vw;
    align-items: start;
    min-height: 0;
  }
  .mvc-side { min-width: 0; margin: 0; padding: 0; }
  .mvc-side.heroes { grid-column: 1 / span 5; }
  .mvc-side.villains { grid-column: 6 / span 7; }
  .mvc-side-label {
    font-family: var(--font-display);
    font-size: clamp(16px, 2.4vh, 28px);
    letter-spacing: 0.08em;
    margin-bottom: 0.5vh;
  }
  .mvc-side.heroes .mvc-side-label { color: #7eb6ff; text-align: left; }
  .mvc-side.villains .mvc-side-label { color: #ff8a7a; text-align: left; }
  .mvc-row {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 0.7vw;
    align-items: stretch;
    width: 100%;
  }
  .mvc-side.villains .mvc-row {
    grid-template-columns: repeat(7, minmax(0, 1fr));
  }
  .mvc-card {
    box-sizing: border-box;
    width: 100%;
    max-width: none;
    min-width: 0;
    overflow: hidden;
    background: linear-gradient(180deg, #1a1e2a 0%, #0b0d12 100%);
    border: 0.28vh solid #f5c518;
    box-shadow: 0 0 0 0.15vh #000, 0 0.8vh 2vh rgba(0,0,0,.55);
    padding: 0.5vh;
    display: flex;
    flex-direction: column;
  }
  .mvc-card.hero { border-color: #2454E8; }
  .mvc-card.villain { border-color: #ff8a8a; }
  .mvc-card.lieutenant { border-color: #b45309; }
  .mvc-card.minion { border-color: #e6ff00; }
  .mvc-art { height: 16vh; flex: 1 1 auto; min-height: 9vh; background: #000; overflow: hidden; border: 0.15vh solid #000; }
  .mvc-side.villains .mvc-art { height: 16vh; min-height: 9vh; }
  .mvc-art img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .mvc-plate {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: clamp(14px, 2.2vh, 26px);
    letter-spacing: 0;
    text-align: center;
    padding: 0.5vh 0.3vw 0.3vh;
    line-height: 1.1;
    overflow: hidden;
    display: block;
    white-space: nowrap;
    word-break: normal;
    text-overflow: clip;
  }
  .mvc-card.hero .mvc-plate,
  .mvc-card.villain .mvc-plate,
  .mvc-card.minion .mvc-plate,
  .mvc-card.lieutenant .mvc-plate {
    font-size: clamp(13px, 2.1vh, 24px);
  }
  .mvc-card .health-bar-track { height: 1vh; margin: 0.35vh 0 0.45vh; }
  .mvc-card .bhd-row { margin-top: 0; gap: 0.3vw; }
  .mvc-card .bhd-stat { cursor: default; padding: 0.35vh 0.15vw; }
  .mvc-card .bhd-stat span { font-size: clamp(9px, 1.15vh, 14px); font-weight: 800; }
  .mvc-card .bhd-stat b { font-size: clamp(14px, 2vh, 22px); }
  .mvc-empty { color: var(--text-lo); font-style: italic; padding: 2vh; font-size: 1.6vh; }
  .mvc-ko { text-align: center; color: var(--text-lo); margin-top: 0.6vh; font-size: 1.4vh; }
  #displayChallenges {
    padding: 0.6vh 0 0;
    width: 100%;
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 0.8vw;
    justify-content: center;
  }
  #displayChallenges .challenge-board-card {
    min-width: 0;
    font-size: clamp(14px, 1.8vh, 22px);
    padding: 0.8vh 1vw;
    margin: 0;
  }
  #displayChallenges .challenge-board-top { margin-bottom: 0.4vh; gap: 1vw; }
  #displayChallenges .challenge-board-title { font-size: clamp(18px, 2.4vh, 32px); }
  #displayChallenges .challenge-path-row { margin-bottom: 0.3vh; }
  #displayChallenges .challenge-path-label { font-size: clamp(16px, 2.2vh, 28px); font-family: var(--font-body); font-weight: 600; }
  #displayChallenges .challenge-success-title { text-decoration: line-through; }
  #displayChallenges .challenge-outcome {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 8vw;
    padding: 0.5vh 1vw;
    font-family: var(--font-display);
    font-size: clamp(16px, 2vh, 26px);
    letter-spacing: 0.06em;
    color: #fff;
    text-transform: uppercase;
  }
  #displayChallenges .challenge-outcome.success { background: #1f8a3b; }
  #displayChallenges .challenge-outcome.fail { background: #c42828; }
  #rollOverlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(11,13,18,0.94);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 2vh;
  }
  #rollOverlay .roll-who { font-family: var(--font-display); font-size: 4vh; color: var(--accent); letter-spacing: 1px; }
  #rollOverlay .roll-dice-row { display: flex; gap: 2vw; margin: 2vh 0; }
  #rollOverlay .roll-die-block { display: flex; flex-direction: column; align-items: center; gap: 0.6vh; }
  #rollOverlay .roll-die-label { font-family: var(--font-data); font-size: 1.4vh; color: var(--text-lo); text-transform: uppercase; letter-spacing: 0.12em; }
  #rollOverlay .roll-die-value { font-family: var(--font-display); font-size: 6vh; color: var(--text-hi); }
  #rollOverlay .roll-effect { font-family: var(--font-display); font-size: 2.6vh; color: var(--yellow); margin-top: 1vh; }
</style>
</head>
<body>

<div id="rollOverlay" class="hidden"></div>

<div id="displayFrame">
<div id="displayStage">
  <div class="display-tracker-center">
    <h1 id="displaySceneName">No active scene</h1>
  </div>
  <div class="display-tracker-wrap">
    <div id="displayTrackerRow"></div>
  </div>
  <div id="displayEnvironment" class="board-environment"></div>

  <main class="view display-main">
    <div id="displayEmpty" class="empty-display">Waiting for the GM to load a scene…</div>
    <div id="locationsRow" class="locations-row"></div>
    <div id="displayChallenges"></div>
  </main>
</div>
</div>

<script src="vendor/papaparse.min.js"></script>
<script src="display.js"></script>
</body>
</html>
